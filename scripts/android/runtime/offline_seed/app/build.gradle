plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'rb.offline'
    compileSdk __COMPILE_SDK__
    buildToolsVersion '__BUILD_TOOLS_VERSION__'
    defaultConfig {
        applicationId 'rb.offline.smoke'
        minSdk 23
        targetSdk __COMPILE_SDK__
        versionCode 1
        versionName '1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.fragment:fragment-ktx:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.preference:preference-ktx:1.2.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.6.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.6.0'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    implementation 'androidx.room:room-runtime:2.5.2'
    implementation 'androidx.room:room-ktx:2.5.2'
    kapt 'androidx.room:room-compiler:2.5.2'
    implementation 'androidx.work:work-runtime-ktx:2.8.1'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.media3:media3-exoplayer:1.1.1'
    implementation 'androidx.media3:media3-ui:1.1.1'
}

def offlineCoordinates = [
    'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3',
    'androidx.core:core-ktx:1.10.1',
    'androidx.appcompat:appcompat:1.6.1',
    'androidx.activity:activity-ktx:1.7.2',
    'com.google.android.material:material:1.9.0',
    'androidx.constraintlayout:constraintlayout:2.1.4',
    'androidx.recyclerview:recyclerview:1.3.1',
    'androidx.fragment:fragment-ktx:1.6.1',
    'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1',
    'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1',
    'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1',
    'androidx.preference:preference-ktx:1.2.0',
    'androidx.viewpager:viewpager:1.0.0',
    'androidx.viewpager2:viewpager2:1.0.0',
    'androidx.cardview:cardview:1.0.0',
    'androidx.drawerlayout:drawerlayout:1.2.0',
    'androidx.coordinatorlayout:coordinatorlayout:1.2.0',
    'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0',
    'androidx.documentfile:documentfile:1.0.1',
    'androidx.navigation:navigation-fragment-ktx:2.6.0',
    'androidx.navigation:navigation-ui-ktx:2.6.0',
    'androidx.datastore:datastore-preferences:1.0.0',
    'androidx.room:room-runtime:2.5.2',
    'androidx.room:room-ktx:2.5.2',
    'androidx.room:room-compiler:2.5.2',
    'androidx.work:work-runtime-ktx:2.8.1',
    'com.google.android.flexbox:flexbox:3.0.0',
    'com.google.zxing:core:3.5.1',
    'com.google.code.gson:gson:2.10.1',
    'androidx.media3:media3-exoplayer:1.1.1',
    'androidx.media3:media3-ui:1.1.1',
]

tasks.register('seedOfflineDependencies') {
    doLast {
        offlineCoordinates.each { coordinate ->
            project.configurations.detachedConfiguration(
                project.dependencies.create(coordinate)
            ).resolve()
        }
    }
}
